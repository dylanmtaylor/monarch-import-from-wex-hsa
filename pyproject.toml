[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monarch-import-from-wex-hsa"
version = "0.1.0"
description = "Automated extraction and conversion tool for WEX HSA Cash and Investment accounts into Monarch Money."
readme = "README.md"
authors = [{ name = "Dylan M. Taylor", email = "dylan@dylanmtaylor.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
]
requires-python = ">=3.9"
dependencies = [
    "websocket-client>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
wex-hsa-to-monarch = "wex_hsa_to_monarch.cli:main"
